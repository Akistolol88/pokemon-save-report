plugins {
    // Shared convention plugins for the Java toolchain and static analysis.
    id 'lnu.java-conventions'
    id 'lnu.quality-conventions'

    // Packages and runs the application.
    id 'application'
}

group = 'se.lnu.savereport'
version = '1.0.1'

application {
    mainClass = 'se.lnu.savereport.App'
}

// Lets the app read what the user types when started with `gradlew run`.
run {
    standardInput = System.in
}

// Builds one runnable JAR (`java -jar`) that also contains the savechecker module and
// svg-charts, so users only need Java to run it.
jar {
    archiveBaseName = 'pokemon-save-report'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Build savechecker's JAR first, since its classes are copied in below.
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

dependencies {
    implementation project(':savechecker')
    implementation 'com.github.Robert060615:svg-charts-module:v1.0.1'
}
